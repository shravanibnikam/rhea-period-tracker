<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rhea · Period tracker</title>
    <meta name="description" content="A free, open-source, local-first period tracker that works offline, with account sync and a partner view you choose. Synced data is not end-to-end encrypted." />
    <meta name="theme-color" content="#FBF7F5" />
    <link rel="icon" href="/rhea-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; } html { background: #FBF7F5; } html.dark { background: #1B1519; }</style>
    <script>
      // Theme before first paint (mirrors useTheme.applyTheme). Never dark when the landing gate
      // will show: the landing is designed light (mirrors App.wantsLanding and welcome.ts).
      try {
        var welcomed = false;
        try {
          welcomed = localStorage.getItem("rhea:welcomed") === "1";
        } catch (e) {}
        var standalone =
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches === true) ||
          navigator.standalone === true;
        var h = location.hash;
        var landing = h === "#welcome" || (h === "" && !welcomed && !standalone);
        var t = localStorage.getItem("rhea:theme");
        if (!landing && (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
